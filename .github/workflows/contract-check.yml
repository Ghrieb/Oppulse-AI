name: Contract

# The frontend's contract is the contract of record. This job proves the
# backend and the frontend still agree on it, and that the shared rule cases
# still produce the same answers on both sides.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the frontend
        working-directory: frontend
        run: npm ci

      - name: Install the backend
        working-directory: backend
        run: uv sync --all-extras

      - name: The rule cases are current
        working-directory: frontend
        run: node scripts/check-rule-cases.mjs

      - name: The path list is current
        working-directory: frontend
        run: node scripts/export-contract-paths.mjs && git diff --exit-code -- ../contracts/paths.json

      - name: The OpenAPI document is current
        working-directory: backend
        run: uv run python scripts/export_openapi.py && git diff --exit-code -- ../contracts/openapi.json

      - name: The backend serves the contract
        working-directory: backend
        run: uv run python scripts/check_contract.py --strict
