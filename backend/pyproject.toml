[project]
name = "oppulse-backend"
version = "0.1.0"
description = "The Oppulse AI backend: the API, the agent loop and the evaluation harness."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "pypdf>=6",
    "python-docx>=1.2",
]

[project.optional-dependencies]
# Staging and production run on Supabase Postgres. The models are written to
# be portable; only the driver changes.
postgres = ["asyncpg>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "C4", "PIE", "PT"]
ignore = [
    # The API surface mirrors the frontend contract, whose identifiers are
    # camelCase on the wire and snake_case in Python.
    "N815",
    "N806",
    # The user-facing copy uses typographic quotes, and it has to match the
    # frontend's copy exactly.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "B011"]
"scripts/**" = ["S603", "S607"]
# `Depends(...)` in an argument default is FastAPI's dependency-injection
# idiom, not a mutable default.
"app/api/**" = ["B008"]
"app/security/**" = ["B008"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
mypy_path = "."
packages = ["app"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "pypdfium2.*", "docx.*", "rapidocr.*", "numpy.*", "PIL.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
